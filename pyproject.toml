[project]
name = "stash-image-classifier"
version = "0.1.0"
description = "Stash plugin that classifies images using classical ML and applies tags"
requires-python = ">=3.9"
dependencies = [
    "ultralytics>=8.0.0",
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    "requests>=2.31.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "mypy>=1.0.0",
    "flake8>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
