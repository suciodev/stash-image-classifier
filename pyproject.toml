[project]
name = "stash-image-classifier"
version = "0.1.0"
description = "Stash plugin that classifies images using classical ML and applies tags"
requires-python = ">=3.9"
dependencies = [
    "ultralytics>=8.0.0",
    "opencv-python-headless>=4.8.0",
    "Pillow>=10.0.0",
    "requests>=2.31.0",
    "torch>=2.0.0",
]

# On Linux, use CPU-only torch wheels (~1 GB vs ~2.5 GB for the CUDA build).
# torch is listed explicitly above so this source override can apply to it.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "mypy>=1.0.0",
    "flake8>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
