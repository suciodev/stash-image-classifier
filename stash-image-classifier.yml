name: PerceptTag
description: ML-powered image tagger for Stash. Applies exclude/NSFW severity tags (explicit, revealing, suggestive) using local YOLOv8 person detection and NudeNet body-part inference. Fully offline — no AI API calls.
url: https://github.com/suciodev/stash-image-classifier
version: 0.4.0
exec:
  - python
  - "{pluginDir}/main.py"
interface: raw
tasks:
  - name: Classify All Images
    description: Classify every image in the library. Applies exclude or NSFW severity tags. Removes stale 'exclude' tags from images now detected as having a person or NSFW content.
    defaultArgs:
      mode: classify
      batch_size: 50
  - name: Classify Untagged Images
    description: Same as above but skips images that already carry any classifier tag (exclude, explicit, revealing, suggestive). Safe to re-run after adding new images.
    defaultArgs:
      mode: classify
      batch_size: 50
      skip_tagged: true
  - name: Recheck Exclude-Tagged Images
    description: Re-classifies images currently tagged only with 'exclude', skipping images that already carry an NSFW severity tag. Useful after threshold tuning to catch potential mis-tags.
    defaultArgs:
      mode: classify
      batch_size: 50
      recheck_exclude: true
  - name: Classify Marked Images
    description: >
      Classifies only images tagged with 'percepttag:pending'. Applies exclude/NSFW
      severity tags as normal, then swaps the marker to 'percepttag:done'. Use
      Stash's bulk-select UI to mark images before running.
    defaultArgs:
      mode: classify
      batch_size: 50
      tagged_only: true
hooks:
  - name: Auto-classify on scan
    description: Classify each image as it is scanned and apply exclude if no person or NSFW content is detected.
    triggeredBy:
      - Image.Create.Post
